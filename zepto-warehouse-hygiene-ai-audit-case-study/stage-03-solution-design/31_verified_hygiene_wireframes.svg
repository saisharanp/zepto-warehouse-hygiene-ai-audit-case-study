<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">Verified Hygiene Check low-fidelity wireframes</title>
  <desc id="desc">Six annotated product wireframes covering operations queue, manager task start, guided capture, QA review, remediation, and customer verification detail. All displayed data is illustrative sample data, not live Zepto telemetry.</desc>
  <style>
    .canvas { fill: #eef2f7; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .screen { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
    .line { stroke: #94a3b8; stroke-width: 2; }
    .dark { fill: #0f172a; }
    .muted { fill: #64748b; }
    .blue { fill: #2563eb; }
    .blue-soft { fill: #dbeafe; }
    .green { fill: #15803d; }
    .green-soft { fill: #dcfce7; }
    .amber { fill: #b45309; }
    .amber-soft { fill: #fef3c7; }
    .red { fill: #b91c1c; }
    .red-soft { fill: #fee2e2; }
    .white { fill: #ffffff; }
    .text { fill: #0f172a; font-family: Inter, Arial, sans-serif; }
    .small { font-size: 13px; }
    .body { font-size: 16px; }
    .label { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
    .title { font-size: 18px; font-weight: 700; }
    .panel-title { font-size: 20px; font-weight: 700; }
    .caption { font-size: 13px; fill: #475569; font-family: Inter, Arial, sans-serif; }
  </style>

  <rect class="canvas" x="0" y="0" width="1800" height="1220"/>
  <text class="text" x="40" y="35" font-size="24" font-weight="700">Verified Hygiene Check: annotated wireframes</text>
  <text class="caption" x="40" y="57">Proposed low-fidelity flow. Illustrative sample data: not live Zepto telemetry. Human decision authority remains visible.</text>

  <!-- W-01 -->
  <g>
    <rect class="panel" x="40" y="80" width="540" height="520" rx="14"/>
    <text class="text panel-title" x="64" y="114">W-01 Quality operations queue</text>
    <text class="caption" x="64" y="136">Quality lead sees due work, risk, integrity, and holds.</text>
    <rect class="screen" x="64" y="154" width="492" height="420" rx="8"/>
    <rect class="dark" x="64" y="154" width="492" height="54" rx="8"/>
    <text class="white title" x="84" y="187">Verified Hygiene Check</text>
    <text class="white small" x="468" y="187">QA ▾</text>
    <rect class="white" x="82" y="226" width="142" height="58" rx="8"/>
    <text class="muted small" x="96" y="248">Due today</text>
    <text class="text title" x="96" y="271">18</text>
    <rect class="white" x="240" y="226" width="142" height="58" rx="8"/>
    <text class="muted small" x="254" y="248">High risk</text>
    <text class="red title" x="254" y="271">4</text>
    <rect class="white" x="398" y="226" width="142" height="58" rx="8"/>
    <text class="muted small" x="412" y="248">Open holds</text>
    <text class="amber title" x="412" y="271">2</text>
    <text class="muted label" x="84" y="318">STORE / REASON</text>
    <text class="muted label" x="330" y="318">STATUS</text>
    <text class="muted label" x="460" y="318">DUE</text>
    <line class="line" x1="84" y1="329" x2="536" y2="329"/>
    <text class="text body" x="84" y="359">Example store A · complaint</text>
    <rect class="red-soft" x="330" y="341" width="98" height="25" rx="12"/>
    <text class="red small" x="348" y="359">High risk</text>
    <text class="text small" x="460" y="359">10:30</text>
    <line class="line" x1="84" y1="378" x2="536" y2="378"/>
    <text class="text body" x="84" y="408">Example store B · overdue</text>
    <rect class="amber-soft" x="330" y="390" width="98" height="25" rx="12"/>
    <text class="amber small" x="350" y="408">Overdue</text>
    <text class="text small" x="460" y="408">11:00</text>
    <line class="line" x1="84" y1="427" x2="536" y2="427"/>
    <text class="text body" x="84" y="457">Example store C · session review</text>
    <rect class="blue-soft" x="330" y="439" width="98" height="25" rx="12"/>
    <text class="blue small" x="348" y="457">Review</text>
    <text class="text small" x="460" y="457">12:00</text>
    <rect class="blue" x="84" y="498" width="142" height="38" rx="7"/>
    <text class="white body" x="108" y="523">Open risk map</text>
    <text class="caption" x="84" y="560">Decision support: why now, what is affected, who owns the next action.</text>
  </g>

  <!-- W-02 -->
  <g>
    <rect class="panel" x="620" y="80" width="540" height="520" rx="14"/>
    <text class="text panel-title" x="644" y="114">W-02 Start verified check</text>
    <text class="caption" x="644" y="136">Manager sees scope, notice, and session validity before recording.</text>
    <rect class="screen" x="770" y="154" width="240" height="420" rx="24"/>
    <rect class="dark" x="770" y="154" width="240" height="56" rx="24"/>
    <text class="white title" x="790" y="188">Today’s check</text>
    <text class="white small" x="963" y="188">⋯</text>
    <text class="muted label" x="792" y="239">STORE</text>
    <text class="text body" x="792" y="262">Example store A · EX-018</text>
    <rect class="blue-soft" x="792" y="280" width="196" height="48" rx="8"/>
    <text class="blue label" x="808" y="301">DUE BY 10:30</text>
    <text class="blue small" x="808" y="319">Complaint-triggered check</text>
    <text class="muted label" x="792" y="361">BEFORE YOU START</text>
    <text class="text small" x="792" y="385">• Camera and location are required</text>
    <text class="text small" x="792" y="407">• Audio is off by default</text>
    <text class="text small" x="792" y="429">• Do not record personal screens</text>
    <rect class="amber-soft" x="792" y="447" width="196" height="42" rx="8"/>
    <text class="amber small" x="808" y="466">Scan the in-store QR/NFC</text>
    <text class="amber small" x="808" y="483">after entering the warehouse.</text>
    <rect class="blue" x="792" y="510" width="196" height="42" rx="8"/>
    <text class="white body" x="838" y="537">Start secure check</text>
    <text class="caption" x="644" y="585">Error state: location mismatch or expired task routes to support, never silent pass.</text>
  </g>

  <!-- W-03 -->
  <g>
    <rect class="panel" x="1200" y="80" width="540" height="520" rx="14"/>
    <text class="text panel-title" x="1224" y="114">W-03 Guided zone capture</text>
    <text class="caption" x="1224" y="136">Manager is guided through the route and gets actionable re-scan prompts.</text>
    <rect class="screen" x="1350" y="154" width="240" height="420" rx="24"/>
    <rect class="dark" x="1350" y="154" width="240" height="48" rx="24"/>
    <text class="white title" x="1370" y="185">Ambient zone</text>
    <text class="white small" x="1535" y="185">3 / 6</text>
    <rect class="blue" x="1370" y="219" width="200" height="116" rx="8"/>
    <rect class="white" x="1388" y="235" width="76" height="74" rx="4" opacity=".85"/>
    <line class="line" x1="1480" y1="250" x2="1555" y2="250"/>
    <line class="line" x1="1480" y1="270" x2="1540" y2="270"/>
    <line class="line" x1="1480" y1="290" x2="1552" y2="290"/>
    <text class="white small" x="1390" y="326">LIVE · evidence encrypted</text>
    <text class="muted label" x="1370" y="363">SHOW NEXT</text>
    <text class="text body" x="1370" y="388">Lower shelf + floor junction</text>
    <text class="muted small" x="1370" y="409">Random prompt · 8 sec minimum view</text>
    <rect class="green-soft" x="1370" y="430" width="200" height="42" rx="8"/>
    <text class="green small" x="1384" y="456">Coverage good · keep moving</text>
    <rect class="blue" x="1370" y="493" width="95" height="40" rx="7"/>
    <text class="white body" x="1384" y="519">Next zone</text>
    <rect class="white" x="1475" y="493" width="95" height="40" rx="7" stroke="#2563eb"/>
    <text class="blue body" x="1493" y="519">Pause</text>
    <text class="caption" x="1224" y="585">Failure state: poor visibility blocks completion and asks for a re-scan or human review.</text>
  </g>

  <!-- W-04 -->
  <g>
    <rect class="panel" x="40" y="640" width="540" height="520" rx="14"/>
    <text class="text panel-title" x="64" y="674">W-04 QA evidence review</text>
    <text class="caption" x="64" y="696">Reviewer can see model output, policy context, evidence, and decision authority.</text>
    <rect class="screen" x="64" y="714" width="492" height="420" rx="8"/>
    <text class="muted label" x="84" y="744">CASE VH-01842 · Example store B · 10:18</text>
    <rect class="red-soft" x="84" y="762" width="116" height="28" rx="14"/>
    <text class="red label" x="101" y="781">CRITICAL</text>
    <rect class="amber-soft" x="214" y="762" width="112" height="28" rx="14"/>
    <text class="amber label" x="233" y="781">UNKNOWN</text>
    <text class="text title" x="84" y="824">Possible pest evidence</text>
    <rect class="dark" x="84" y="842" width="190" height="128" rx="6"/>
    <circle cx="184" cy="902" r="28" fill="#475569"/>
    <text class="white small" x="98" y="954">Frame 07 · 00:06:18</text>
    <text class="muted label" x="300" y="848">MODEL SUMMARY</text>
    <text class="text small" x="300" y="872">Confidence: 0.78</text>
    <text class="text small" x="300" y="894">Model: screen-v0.3</text>
    <text class="text small" x="300" y="916">Policy: hygiene-v2.1</text>
    <text class="text small" x="300" y="938">Route: 94% complete</text>
    <text class="muted label" x="84" y="1010">REVIEW ACTION</text>
    <rect class="white" x="84" y="1025" width="104" height="38" rx="7" stroke="#15803d"/>
    <text class="green body" x="109" y="1050">Release</text>
    <rect class="red" x="198" y="1025" width="104" height="38" rx="7"/>
    <text class="white body" x="225" y="1050">Hold</text>
    <rect class="white" x="312" y="1025" width="104" height="38" rx="7" stroke="#b45309"/>
    <text class="amber body" x="327" y="1050">Physical check</text>
    <text class="caption" x="64" y="1148">Critical finding never auto-passes; reviewer rationale is required before release.</text>
  </g>

  <!-- W-05 -->
  <g>
    <rect class="panel" x="620" y="640" width="540" height="520" rx="14"/>
    <text class="text panel-title" x="644" y="674">W-05 Remediation and re-check</text>
    <text class="caption" x="644" y="696">Containment, ownership, SLA, and release authority are explicit.</text>
    <rect class="screen" x="644" y="714" width="492" height="420" rx="8"/>
    <rect class="red-soft" x="664" y="736" width="452" height="58" rx="8"/>
    <text class="red label" x="682" y="760">HOLD ACTIVE · AMBIENT ZONE</text>
    <text class="red small" x="682" y="780">Affected scope: 12 SKUs · 1 aisle · customer orders paused</text>
    <text class="muted label" x="664" y="828">REMEDIATION TASK</text>
    <text class="text body" x="664" y="854">Pest-control inspection + cleaning</text>
    <text class="muted small" x="664" y="878">Owner: Store manager · SLA: 2 hours · Evidence required</text>
    <line class="line" x1="664" y1="894" x2="1116" y2="894"/>
    <text class="muted label" x="664" y="925">CHECKLIST</text>
    <text class="green body" x="664" y="951">✓ Area cleaned and photographed</text>
    <text class="amber body" x="664" y="978">○ Pest-control report attached</text>
    <text class="amber body" x="664" y="1005">○ QA re-check pending</text>
    <rect class="blue" x="664" y="1030" width="158" height="40" rx="7"/>
    <text class="white body" x="690" y="1056">Request re-check</text>
    <rect class="white" x="834" y="1030" width="126" height="40" rx="7" stroke="#b91c1c"/>
    <text class="red body" x="859" y="1056">Keep hold</text>
    <text class="caption" x="644" y="1148">Manager can submit evidence; authorised QA/Food Safety releases the hold.</text>
  </g>

  <!-- W-06 -->
  <g>
    <rect class="panel" x="1200" y="640" width="540" height="520" rx="14"/>
    <text class="text panel-title" x="1224" y="674">W-06 Verification detail</text>
    <text class="caption" x="1224" y="696">Post-validation customer/support view; restrained and scoped.</text>
    <rect class="screen" x="1350" y="714" width="240" height="420" rx="24"/>
    <rect class="dark" x="1350" y="714" width="240" height="50" rx="24"/>
    <text class="white title" x="1370" y="746">Store details</text>
    <text class="muted label" x="1370" y="800">STORAGE CONTROLS</text>
    <text class="text body" x="1370" y="826">Last verified 10 Aug 2026</text>
    <rect class="green-soft" x="1370" y="848" width="200" height="48" rx="8"/>
    <text class="green label" x="1386" y="870">VISIBLE CONTROLS REVIEWED</text>
    <text class="green small" x="1386" y="887">Scope and freshness shown</text>
    <text class="muted label" x="1370" y="931">WHAT THIS MEANS</text>
    <text class="text small" x="1370" y="954">Visible hygiene controls and</text>
    <text class="text small" x="1370" y="974">operating records were reviewed.</text>
    <text class="muted label" x="1370" y="1012">WHAT IT DOES NOT MEAN</text>
    <text class="text small" x="1370" y="1035">Not a government certificate.</text>
    <text class="text small" x="1370" y="1055">Does not prove microbial safety.</text>
    <rect class="white" x="1370" y="1075" width="200" height="36" rx="7" stroke="#2563eb"/>
    <text class="blue body" x="1420" y="1099">See verification scope</text>
    <text class="caption" x="1224" y="1148">If stale or incident-linked, hide this view and route to support policy.</text>
  </g>
</svg>
